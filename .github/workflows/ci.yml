name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The basic provider is the open-source (MIT) cache; the default one has separate terms.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Unit tests, lint and debug build
        run: >-
          ./gradlew
          :shared:test :wear:testDebugUnitTest :mobile:testDebugUnitTest
          :wear:lintDebug :mobile:lintDebug
          assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
          retention-days: 14
